# Private file endpoint for the local Bot API server.
#
# In --local mode getFile returns an absolute path such as
#   /var/lib/telegram-bot-api/<bot>/videos/file_7.mp4
# The bot runs in another container, so it fetches the same file from
#   http://telegram-bot-api.railway.internal:8082/<bot>/videos/file_7.mp4
# and DELETEs it once its job is done.
#
# Reachable only over Railway's private network (no public domain is attached).
# Paths contain the bot's directory name, so access logging stays off.

user telegram-bot-api telegram-bot-api;
worker_processes 2;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    default_type application/octet-stream;
    # Large files stream straight from disk; nothing is buffered in memory.
    output_buffers 2 1m;

    server {
        listen 8082;
        listen [::]:8082;

        root /var/lib/telegram-bot-api;
        autoindex off;

        # Exactly <bot>/<type>/<file>: downloaded media only. TDLib's own
        # database files live one level up and are never reachable.
        location ~ "^/[^/]+/[^/]+/[^/]+$" {
            limit_except GET HEAD DELETE {
                deny all;
            }
            dav_methods DELETE;
        }

        location / {
            return 404;
        }
    }
}
