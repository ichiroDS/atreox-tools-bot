# Local convenience only. Production deploys the image from the Dockerfile
# directly - the entrypoint waits for the database and migrates on its own, so
# no orchestration is required.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atreox
      POSTGRES_PASSWORD: atreox
      POSTGRES_DB: atreox
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atreox -d atreox"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://atreox:atreox@db:5432/atreox
      TEMP_ROOT: /tmp/atreox-tools
    depends_on:
      db:
        condition: service_healthy
    tmpfs:
      # User media never touches a persistent volume.
      - /tmp/atreox-tools:mode=1777
    restart: unless-stopped

  # Optional local Bot API server, the same image Railway runs:
  #   docker compose --profile local-bot-api up --build
  # and in .env: BOT_API_BASE_URL=http://bot-api:8081
  #              BOT_API_FILES_URL=http://bot-api:8082
  # Needs TELEGRAM_API_ID / TELEGRAM_API_HASH in .env, and a bot token that
  # has been logged out of the cloud API (see scripts/cutover_local_bot_api.py).
  bot-api:
    profiles: ["local-bot-api"]
    build:
      context: .
      dockerfile: deploy/telegram-bot-api/Dockerfile
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
    restart: unless-stopped

volumes:
  pgdata:
